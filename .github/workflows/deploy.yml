name: Build and deploy to EC2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: linkdrop-ec2-deploy
  cancel-in-progress: false
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
jobs:
  deploy:
    # Keep the first public push safe; deployments start after Terraform outputs are configured in GitHub.
    if: vars.AWS_REGION != '' && vars.AWS_ROLE_ARN != '' && vars.EC2_INSTANCE_ID != '' && vars.ECR_REPOSITORY != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Obtain short-lived AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: linkdrop-${{ github.run_id }}
      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7
      - name: Build and push the web image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          image_uri="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --pull --tag "$image_uri" ./app
          docker push "$image_uri"
          echo "uri=$image_uri" >> "$GITHUB_OUTPUT"
      - name: Deploy the image using AWS Systems Manager
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          compose_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/docker-compose.yaml"
          cat > /tmp/deploy.sh <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          AWS_REGION="${AWS_REGION}"
          REGISTRY="${REGISTRY}"
          IMAGE_URI="${IMAGE_URI}"
          COMPOSE_URL="__COMPOSE_URL__"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          cd /opt/linkdrop
          curl --fail --silent --show-error --location "$COMPOSE_URL" --output docker-compose.yaml
          grep -v '^LINKDROP_IMAGE=' .env > .env.next || true
          printf 'LINKDROP_IMAGE=%s\nAPP_PORT=80\n' "$IMAGE_URI" >> .env.next
          mv .env.next .env
          chmod 600 .env
          docker compose --env-file .env -f docker-compose.yaml pull
          docker compose --env-file .env -f docker-compose.yaml up -d --no-build --remove-orphans
          docker compose --env-file .env -f docker-compose.yaml ps
          SCRIPT
          sed -i "s|__COMPOSE_URL__|$compose_url|" /tmp/deploy.sh
          jq -n --arg script "$(cat /tmp/deploy.sh)" '{commands:[$script]}' > /tmp/ssm-parameters.json
          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Linkdrop commit $GITHUB_SHA" \
            --parameters file:///tmp/ssm-parameters.json \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $command_id"
          for attempt in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query StandardOutputContent --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query '{Status:Status,Error:StandardErrorContent,Output:StandardOutputContent}' --output json
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Systems Manager deployment command $command_id" >&2
          exit 1
