<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <title>Linkdrop — URL shortener</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f7f8fc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px 18px; background: radial-gradient(ellipse at 50% 0%, #e7eaff 0, #f7f8fc 52%); }
    main { width: min(100%, 540px); }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; font-size: 15px; font-weight: 750; letter-spacing: -.03em; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; color: white; background: #5b5ce2; box-shadow: 0 5px 14px #5b5ce244; }
    .card { padding: clamp(24px, 6vw, 38px); border: 1px solid #e8eaf2; border-radius: 20px; background: #fff; box-shadow: 0 20px 60px #26345b12; }
    .eyebrow { margin: 0 0 10px; color: #5b5ce2; font-size: 12px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(30px, 7vw, 40px); line-height: 1.1; letter-spacing: -.055em; }
    .intro { margin: 12px 0 28px; color: #687187; font-size: 15px; line-height: 1.6; }
    label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; }
    .input-row { display: flex; gap: 10px; }
    input { min-width: 0; flex: 1; height: 50px; padding: 0 14px; border: 1px solid #dfe2ec; border-radius: 10px; outline: none; color: #172033; font: inherit; font-size: 14px; transition: border-color .15s, box-shadow .15s; }
    input::placeholder { color: #a0a6b5; }
    input:focus { border-color: #7778ed; box-shadow: 0 0 0 3px #5b5ce21c; }
    button { border: 0; border-radius: 10px; background: #5b5ce2; color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; transition: background .15s, transform .15s; }
    button:hover { background: #494acb; }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .65; cursor: wait; }
    #submit { min-width: 118px; padding: 0 16px; }
    .message { margin: 10px 0 0; min-height: 20px; color: #b42335; font-size: 13px; }
    .result { display: none; margin-top: 20px; padding: 16px; border: 1px solid #e6e7f8; border-radius: 12px; background: #f8f8ff; }
    .result.visible { display: block; }
    .result-label { margin: 0 0 8px; color: #687187; font-size: 12px; font-weight: 650; }
    .result-row { display: flex; align-items: center; gap: 10px; }
    #short-link { min-width: 0; overflow: hidden; color: #494acb; font-size: 14px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    #copy { flex: 0 0 auto; padding: 10px 12px; background: #ececff; color: #494acb; font-size: 12px; }
    #copy:hover { background: #dfdfff; }
    .hint { margin: 20px 0 0; color: #9299aa; font-size: 12px; text-align: center; }
    @media (max-width: 440px) { .input-row { flex-direction: column; } #submit { height: 48px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="brand-mark" aria-hidden="true">↗</span> Linkdrop</div>
    <section class="card" aria-labelledby="title">
      <p class="eyebrow">Short links, simply</p>
      <h1 id="title">Make your link shorter.</h1>
      <p class="intro">Paste a long URL below and get a tidy link you can share anywhere.</p>
      <form id="shorten-form">
        <label for="url">Your long URL</label>
        <div class="input-row">
          <input id="url" name="url" type="url" placeholder="https://example.com/your-long-link" autocomplete="url" required>
          <button id="submit" type="submit">Shorten link</button>
        </div>
        <p class="message" id="message" role="status" aria-live="polite"></p>
      </form>
      <div class="result" id="result" aria-live="polite">
        <p class="result-label">Your short link is ready</p>
        <div class="result-row">
          <a id="short-link" href="#" target="_blank" rel="noopener noreferrer"></a>
          <button id="copy" type="button">Copy</button>
        </div>
      </div>
    </section>
    <p class="hint">Your links are saved so they keep working.</p>
  </main>
  <script>
    const form = document.querySelector('#shorten-form');
    const input = document.querySelector('#url');
    const button = document.querySelector('#submit');
    const message = document.querySelector('#message');
    const result = document.querySelector('#result');
    const shortLink = document.querySelector('#short-link');
    const copyButton = document.querySelector('#copy');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      result.classList.remove('visible');
      button.disabled = true;
      button.textContent = 'Working…';
      try {
        const response = await fetch('/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: input.value.trim() })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Could not shorten that URL.');
        const url = new URL(data.short_url, window.location.origin);
        url.host = window.location.host;
        url.protocol = window.location.protocol;
        shortLink.href = url.href;
        shortLink.textContent = url.href;
        result.classList.add('visible');
      } catch (error) {
        message.textContent = error.message || 'Something went wrong. Please try again.';
      } finally {
        button.disabled = false;
        button.textContent = 'Shorten link';
      }
    });

    copyButton.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(shortLink.href);
        copyButton.textContent = 'Copied!';
        window.setTimeout(() => { copyButton.textContent = 'Copy'; }, 1500);
      } catch {
        message.textContent = 'Could not copy automatically. Select the link to copy it.';
      }
    });
  </script>
</body>
</html>
